# Additional RBAC for ClawOpsController (appended to operator ClusterRole)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s4claw-clawops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["claw.prismer.ai"]
    resources: ["clawopsescalations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["claw.prismer.ai"]
    resources: ["clawopsescalations/status"]
    verbs: ["update", "patch"]
