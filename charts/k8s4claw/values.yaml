nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/prismer-ai/k8s4claw
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""  # auto-generated if empty
  annotations: {}

leaderElection:
  enabled: true

nativeSidecars:
  enabled: true  # requires Kubernetes 1.28+

webhook:
  port: 9443
  certManager:
    enabled: true
    issuerRef:
      kind: Issuer
      name: ""  # auto-created if empty
  selfSigned:
    enabled: false  # auto-enabled when certManager.enabled=false

monitoring:
  enabled: false
  serviceMonitor:
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: true

# -- Companion Claw (claw4k8s) RBAC for autonomous ops.
# Creates namespace-scoped ServiceAccount, Role, and RoleBinding
# for the Companion Claw runtime (k8sops). The Companion has
# read-only access to diagnostics and can only write to
# ClawOpsEscalation/status (no Claw CR writes).
companion:
  rbac:
    create: false
    # Namespaces where Companion Claw RBAC should be created.
    # Typically the namespace(s) where your Claw agents run.
    namespaces: []
    # namespaces:
    #   - default
    #   - ai-agents
  serviceAccountName: claw4k8s-companion

nodeSelector: {}
tolerations: []
affinity: {}
